mod.id = "fasthoppers"
mod.name = "Fast Hoppers"
mod.group = "gay.bagel"
# Permanent placeholder — never bump this. Real versions come from the git tag, which CI
# passes in as MOD_VERSION; this is only what a local build with no tag calls itself.
