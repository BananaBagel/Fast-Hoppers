org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Without this Gradle configures all twelve Stonecutter targets before running anything, so
# building one version resolves dependencies for every version and both loader eras. That is why a
# CI job building 26.2 failed while configuring 1.19.2: it was never only building 26.2.
org.gradle.configureondemand=true

# Resolution reaches third-party Maven hosts, and a slow one used to hang until the default timeout
# and fail the whole build. Long enough to ride out a slow response, short enough not to stall a
# job for minutes when a host is genuinely down.
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000
