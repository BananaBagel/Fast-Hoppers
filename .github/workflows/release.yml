name: release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

# Releases attach assets to a tag, so two runs for the same tag must never overlap. Never
# cancelled mid-flight: a half-published release is worse than a queued one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Tag
    runs-on: ubuntu-latest
    # Read-only now that a mismatch no longer deletes the tag or the release.
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Only reads one file out of the working tree; no history needed.
          fetch-depth: 1

      # The tag is the version — it is passed to the build as MOD_VERSION and nothing in the
      # repository records a version to disagree with it, so there is no longer a mismatch
      # to detect. All that is left is rejecting a tag that is not a version at all, since
      # this workflow fires on every tag pushed.
      - name: Validate tag is a version
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not a version number, so no release was made."
            echo "::error::Expected something like 1.2.3, 1.2.3-beta.1 or 1.2.3-rc1 — note there is no 'v' prefix."
            echo "::error::Nothing has been published and the tag is untouched. To remove it:"
            echo "::error::  git push origin :refs/tags/$TAG && git tag -d $TAG"
            exit 1
          fi
          echo "✓ '$TAG' is a version; releasing under it."

  build:
    needs: validate
    uses: ./.github/workflows/build_reusable.yml
    with:
      release: true
      # The one place the suite runs. A failure here fails the release before anything is
      # published, which is the point — ordinary pushes stay untested and unblocked.
      gametest: true
      # The tag is the version. This is the only place a real version enters the build.
      version: ${{ github.ref_name }}

  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    needs: build
    # Only reads history to render a changelog; the release itself is cut by github-release.
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare git-cliff
        run: |
          REPO_URL="https://github.com/${{ github.repository }}"
          sed -i "s|%%%repo_url%%%|${REPO_URL}|g" cliff.toml

      - name: Generate changelog with git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          args: --latest --strip header --output CHANGELOG.md
          version: 'v2.10.1'

      - name: Upload changelog
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: CHANGELOG.md

  github-release:
    name: Release to GitHub
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build/libs/

      - name: Download changelog
        uses: actions/download-artifact@v4
        with:
          name: changelog
          path: .

      - name: Create or update GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "Creating or updating release for $TAG"
          # Try to create the release first
          if ! gh release create "$TAG" \
            --title "$TAG" \
            --notes-file CHANGELOG.md \
            --latest \
            --verify-tag \
            ./build/libs/$TAG/*.jar; then

            echo "Release already exists. Updating existing release..."

            # Update release notes and mark as latest
            gh release edit "$TAG" \
              --title "$TAG" \
              --notes-file CHANGELOG.md \
              --latest

            # Re-upload artifacts (delete first to avoid duplicates)
            for FILE in ./build/libs/$TAG/*.jar; do
              NAME=$(basename "$FILE")
              gh release delete-asset "$TAG" "$NAME" -y || true
              gh release upload "$TAG" "$FILE" --clobber
            done
          fi

  platform-release:
    name: Publish ${{ matrix.target }}
    runs-on: ubuntu-latest
    # Waits on github-release rather than running beside it, because the release body is where the
    # changelog is read from — so the platforms carry whatever the GitHub release actually says,
    # including hand edits made to it, rather than a separately generated copy that can drift.
    # It also means nothing reaches Modrinth or CurseForge until the GitHub release exists.
    #
    # build is listed only for its targets output; github-release already depends on it.
    needs: [build, github-release]
    # Reads the release notes; the release itself was already cut by github-release.
    permissions:
      contents: read
    # Off unless the PUB_MODS_ENABLE repository variable is set to "true". Releases are
    # GitHub-only for now; this job is kept wired up so enabling Modrinth and CurseForge
    # later is a matter of setting that variable and the matching tokens, not rebuilding
    # the publishing setup. An unset variable is an empty string, so the default is off.
    if: vars.PUB_MODS_ENABLE == 'true'
    # Publishing to third parties failing must not retract the GitHub release that already
    # succeeded, so this job reports separately rather than failing the run.
    continue-on-error: true

    # Mirrors the build matrix: each target publishes the jar it built, in parallel, and one
    # upload failing leaves the other eleven alone. Running publishMods unqualified would instead
    # configure and rebuild all twelve targets on a single runner.
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.build.outputs.targets) }}

    env:
      MOD_IS_RELEASE: true
      # Without this the publish falls back to the placeholder mod.version and would offer the
      # platforms 0.0.0 while the GitHub release carries the tag.
      MOD_VERSION: ${{ github.ref_name }}
      PUB_DRY_RUN: ${{ vars.PUB_DRY_RUN }}
      PUB_MODS_ENABLE: ${{ vars.PUB_MODS_ENABLE }}
      PUB_MAVEN_ENABLE: ${{ vars.PUB_MAVEN_ENABLE }}
      PUB_MAVEN_CENTRAL_ENABLE: ${{ vars.PUB_MAVEN_CENTRAL_ENABLE }}
      PUB_MAVEN_CENTRAL_SNAPSHOTS: ${{ vars.PUB_MAVEN_CENTRAL_SNAPSHOTS }}
      PUB_MODRINTH_STAGING: ${{ vars.PUB_MODRINTH_STAGING }}
      PUB_MODRINTH_PROJECT_ID: ${{ vars.PUB_MODRINTH_PROJECT_ID }}
      PUB_CURSEFORGE_PROJECT_ID: ${{ vars.PUB_CURSEFORGE_PROJECT_ID }}
      PUB_MODRINTH_TOKEN: ${{ secrets.PUB_MODRINTH_TOKEN }}
      PUB_CURSEFORGE_TOKEN: ${{ secrets.PUB_CURSEFORGE_TOKEN }}
      PUB_SIGNING_KEY: ${{ secrets.PUB_SIGNING_KEY }}
      PUB_SIGNING_ID: ${{ secrets.PUB_SIGNING_ID }}
      PUB_SIGNING_PASSWORD: ${{ secrets.PUB_SIGNING_PASSWORD }}
      PUB_MAVEN_CENTRAL_USERNAME: ${{ secrets.PUB_MAVEN_CENTRAL_USERNAME }}
      PUB_MAVEN_CENTRAL_PASSWORD: ${{ secrets.PUB_MAVEN_CENTRAL_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The built jars are deliberately not downloaded: publishMods uploads its own target's jar
      # task output, so it rebuilds that one target and ignores anything sitting in build/libs.
      # Fetching the merged bundle into all twelve jobs would be twelve wasted downloads.

      # publishMods reads CHANGELOG.md from the repository root while configuring, so the notes
      # have to be on disk before Gradle starts. Taken from the release rather than from the
      # git-cliff artifact so that editing the release description on GitHub is enough to change
      # what Modrinth and CurseForge show — there is one changelog, and GitHub owns it.
      - name: Fetch release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --json body --jq .body > CHANGELOG.md
          # An empty body would silently publish a blank changelog to both platforms, which is
          # tedious to correct afterwards on CurseForge in particular.
          if [[ ! -s CHANGELOG.md ]]; then
            echo "::error::Release $GITHUB_REF_NAME has no notes; refusing to publish a blank changelog."
            exit 1
          fi
          echo "✓ Publishing with the GitHub release notes ($(wc -l < CHANGELOG.md) lines)."

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'microsoft'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      # No separate actions/cache step: setup-gradle above restores and saves the Gradle caches
      # itself, and a second step over ~/.gradle duplicates that work and fights it on save.

      - name: Publish to Platforms
        run: bash .github/scripts/gradle-retry.sh :${{ matrix.target }}:publishMods --stacktrace
